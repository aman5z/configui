<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Site Admin — aman5z.in</title>
<style>
  :root {
    --bg:#0c0e12; --surface:#13161d; --surface2:#1a1e28; --border:#252a38;
    --accent:#00e5a0; --accent2:#00aaff; --danger:#ff5566; --text:#e0e4f0; --text2:#9aa3c0; --muted:#6b7394;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'DM Sans', system-ui, sans-serif; font-size:14px; }
  a { color: var(--accent); }
  h1,h2,h3,h4 { margin:0 0 10px; font-family: 'Space Mono', monospace; }
  button { font-family: inherit; cursor:pointer; }
  input, textarea, select { font-family: inherit; background:var(--surface2); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px 10px; width:100%; font-size:13px; }
  textarea { min-height: 70px; resize: vertical; }
  label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:0.5px; color:var(--muted); margin-bottom:4px; margin-top:12px; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:6px; border:1px solid var(--border); background:var(--surface2); color:var(--text); font-size:13px; font-weight:600; }
  .btn:hover { border-color: var(--accent); }
  .btn-primary { background:var(--accent); color:#0c0e12; border-color:var(--accent); }
  .btn-danger { background:transparent; color:var(--danger); border-color:var(--danger); }
  .btn-sm { padding:4px 10px; font-size:12px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:16px; }
  .card-inner { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:10px; position:relative; }
  .muted { color:var(--muted); font-size:12px; }
  .topbar { position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; justify-content:space-between; align-items:center; }
  .tabs { display:flex; gap:4px; overflow-x:auto; padding:10px 20px 0; background:var(--surface); border-bottom:1px solid var(--border); }
  .tab { padding:8px 14px; border-radius:6px 6px 0 0; background:transparent; border:1px solid transparent; color:var(--muted); font-size:12px; white-space:nowrap; }
  .tab.active { background:var(--surface2); color:var(--accent); border-color:var(--border); border-bottom-color:var(--surface2); }
  .wrap { max-width:900px; margin:0 auto; padding:24px 20px 80px; }
  .panel { display:none; }
  .panel.active { display:block; }
  .move-btns { display:flex; flex-direction:column; gap:2px; }
  .icon-btn { background:transparent; border:1px solid var(--border); border-radius:4px; width:26px; height:22px; color:var(--text2); font-size:11px; padding:0; }
  .icon-btn:hover { border-color:var(--accent); color:var(--accent); }
  .item-toolbar { position:absolute; top:10px; right:10px; display:flex; gap:4px; }
  .status { font-size:12px; padding:4px 10px; border-radius:20px; }
  .status.ok { background:rgba(0,229,160,0.15); color:var(--accent); }
  .status.err { background:rgba(255,85,102,0.15); color:var(--danger); }
  .status.busy { background:rgba(255,209,102,0.15); color:#ffd166; }
  .login-screen { max-width:460px; margin:80px auto; }
  .swatch { width:22px; height:22px; border-radius:5px; border:1px solid var(--border); padding:0; vertical-align:middle; }
  .colorrow { display:flex; align-items:center; gap:8px; }
  .colorrow input[type=text] { flex:1; }
  .thumb { width:100%; height:80px; object-fit:cover; border-radius:6px; border:1px solid var(--border); }
  .imggrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; }
  .imgcell { position:relative; }
  .imgcell .icon-btn { position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.6); }
  .hint { font-size:11px; color:var(--muted); margin-top:4px; }
  .section-toggle { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; margin-bottom:6px; }
  .switch { position:relative; width:38px; height:20px; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--border); border-radius:20px; transition:.2s; cursor:pointer; }
  .slider:before { content:""; position:absolute; height:14px; width:14px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  input:checked + .slider { background:var(--accent); }
  input:checked + .slider:before { transform:translateX(18px); }
  .drag-handle { cursor:grab; color:var(--muted); font-size:14px; padding:0 4px; }
  #toast { position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; }
  .toast-item { padding:10px 16px; border-radius:8px; font-size:13px; background:var(--surface2); border:1px solid var(--border); box-shadow:0 4px 20px rgba(0,0,0,0.4); }
</style>
</head>
<body>

<div id="app"></div>
<div id="toast"></div>

<script src="github-api.js"></script>
<script src="blocks-editor.js"></script>
<script src="admin.js"></script>
</body>
</html>
